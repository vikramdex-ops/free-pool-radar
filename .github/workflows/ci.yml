name: CI

# Purpose, in one line: a merged pull request is a claim, not evidence.
# Migration 0013 sat on main for hours with the admin login throttle silently
# failing open because nobody had ever created those functions in the database,
# and nothing in this repository was in a position to notice. These checks
# catch the class of failure where the code compiles but the change is stale,
# conflicting, or was never actually applicable.

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same ref makes the older run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, build and offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the mergeability check below can fetch main.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The failure that cost the most tonight: a branch cut from an old main
      # merges "cleanly" in a three-way merge while silently reverting
      # everything merged since. A real merge attempt catches it, where a diff
      # review or a passing build does not.
      - name: Mergeability against main
        run: |
          # A trial merge still needs an author and a committer. Without these
          # the step dies with "Committer identity unknown" BEFORE it attempts
          # the merge, and the job then reports the branch as unmergeable - a
          # false failure with nothing to do with the branch. Repo-local, not
          # --global, so nothing is written to the runner's home directory.
          git config user.name  ci
          git config user.email ci@localhost
          git fetch --no-tags origin main
          if ! git merge --no-commit --no-ff origin/main; then
            echo "::error::This branch cannot be merged into main cleanly."
            echo "::error::Rebase onto origin/main before requesting review:"
            echo "::error::  git fetch origin && git rebase origin/main"
            git merge --abort || true
            exit 1
          fi
          git merge --abort || true

      # No secrets are configured anywhere in this workflow, deliberately.
      # Anything that needs the database is out of scope for CI and is
      # verified against the deployed URL instead. See HANDOVER.md.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Offline checks
        run: |
          set -euo pipefail
          failed=0
          for t in \
            test-nav-affordance \
            test-login-throttle \
            test-csp-hash \
            test-methodology-observations \
            test-universal-filters \
            test-sitemap-fresh \
            test-social-preview \
            test-ink-surface-phase \
            test-csp-report-destination \
            test-hero-populations \
            test-sponsors-pool-validation \
            test-abort-covers-body \
            test-apmix-null-not-zero \
            test-apmix-window-guard \
            test-poolpaused-absent-throws \
            test-openrouter-null-price \
            test-api-alias \
            test-canonical-dollars \
            test-free-models-listed \
            test-observation-source \
            test-pool-adoption \
            test-stable-sorts \
            test-sweep-gate \
            test-admin-gate \
            test-arc045-settle-removed \
            test-compare-row-identity \
            test-hero-deescalation \
            test-home-no-replica \
            test-search-gates \
            test-site-origin \
            test-ci-loop-complete
          do
            echo "::group::$t"
            if node "scripts/$t.mjs"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::$t failed"
              failed=1
            fi
          done
          exit "$failed"

      # The MCP server is a separate surface from the website and speaks a
      # protocol the type checker cannot see. This handshake smoke test starts
      # it, sends initialize + tools/list, and asserts the JSON-RPC answers —
      # so a broken server is caught here rather than by a user's agent.
      - name: MCP server smoke test
        run: node mcp/smoke.mjs

      - name: Build
        run: npx next build

