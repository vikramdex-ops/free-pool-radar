name: Update README stats

# Keeps the README's "Live right now" block honest. A scheduled run reads the
# deployed /api/stats and commits the block only when a figure changed, so the
# first thing a visitor sees is never a stale number presented as fact.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: update-readme-stats
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Refresh the stats block
        env:
          # Point a fork's workflow at its own deployment by setting either the
          # repository variable RADAR_BASE_URL or editing this default.
          RADAR_BASE_URL: ${{ vars.RADAR_BASE_URL || 'https://free-pool-radar.vercel.app' }}
        run: node scripts/update-readme-stats.mjs

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "No change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh README live stats"
          git push
