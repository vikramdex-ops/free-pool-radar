name: 🐛 Bug report
description: Something on the site or in the collector is broken (not a data correction — use the Provider/data correction template for that)
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page or API route
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: false
