<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="30 second demo flow: homepage, live filter, provider detail, evidence, open API">
  <rect width="1000" height="300" rx="14" fill="#06080c"/>
  <rect x="0.5" y="0.5" width="999" height="299" rx="14" fill="none" stroke="#1c2634"/>
  <text x="40" y="46" font-family="Archivo, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#e9eef6">SEE IT IN 30 SECONDS</text>
  <line x1="0" y1="66" x2="1000" y2="66" stroke="#1c2634"/>
  <g font-family="Archivo, system-ui, sans-serif" font-size="15" fill="#e9eef6" text-anchor="middle">
    <rect x="40" y="120" width="150" height="64" rx="10" fill="#0c1017" stroke="#1c2634"/>
    <text x="115" y="158">Homepage</text>
    <rect x="240" y="120" width="150" height="64" rx="10" fill="#0c1017" stroke="#1c2634"/>
    <text x="315" y="158">Live</text>
    <rect x="440" y="120" width="150" height="64" rx="10" fill="#0c1017" stroke="#1c2634"/>
    <text x="515" y="150">Filter</text><text x="515" y="170" font-size="12" fill="#8595aa">shared pools</text>
    <rect x="640" y="120" width="150" height="64" rx="10" fill="#0c1017" stroke="#1c2634"/>
    <text x="715" y="150">Provider</text><text x="715" y="170" font-size="12" fill="#8595aa">+ evidence</text>
    <rect x="840" y="120" width="120" height="64" rx="10" fill="#0c1017" stroke="#3ddc84"/>
    <text x="900" y="150" fill="#3ddc84">Open</text><text x="900" y="170" font-size="12" fill="#3ddc84">API</text>
  </g>
  <g stroke="#3ddc84" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="190" y1="152" x2="232" y2="152"/>
    <line x1="390" y1="152" x2="432" y2="152"/>
    <line x1="590" y1="152" x2="632" y2="152"/>
    <line x1="790" y1="152" x2="832" y2="152"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3ddc84"/>
    </marker>
  </defs>
  <text x="500" y="248" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#8595aa">curl https://free-pool-radar.vercel.app/api/live</text>
